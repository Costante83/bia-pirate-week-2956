<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#020406">
<title>=BIA= Pirate Week 2956</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#020406}
body{display:flex;justify-content:center;align-items:flex-start;overflow-x:hidden;font-family:Arial,sans-serif}
.poster{
 position:relative;
 width:min(100vw,941px);
 aspect-ratio:941/1672;
 background:url("pirate-week-vertical.png") center/100% 100% no-repeat;
 overflow:hidden;
}
/* Coordinate percentuali: seguono sempre la locandina, su PC e smartphone. */
.scratch{
 position:absolute;
 left:13.9%; top:43.45%;
 width:72.4%; height:10.9%;
 overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none;
}
.secret{
 position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(135deg,rgba(7,24,28,.98),rgba(3,12,16,.99));
}
#code{
 color:#effff9;font:900 clamp(9px,2.15vw,27px) Consolas,"Courier New",monospace;
 text-align:center;padding:0 3%;letter-spacing:.01em;text-shadow:0 0 10px rgba(91,255,215,.25)
}
#cover{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}

/* Zone cliccabili esattamente sopra i due pulsanti stampati. */
#copy{
 position:absolute;left:8.1%;top:64.55%;width:40.5%;height:7.2%;
 border:0;background:transparent;color:transparent;cursor:pointer;display:none;
}
.rsi{
 position:absolute;left:50.6%;top:64.55%;width:41.3%;height:7.2%;
 display:block;background:transparent;border:0;cursor:pointer;
}
.toast{
 position:absolute;left:50%;top:61.8%;transform:translateX(-50%);
 padding:.5em 1em;border-radius:999px;background:rgba(2,10,14,.94);
 border:1px solid rgba(115,183,211,.8);color:#e9f8ff;
 font-size:clamp(9px,1.5vw,16px);font-weight:800;opacity:0;
 pointer-events:none;transition:opacity .25s;white-space:nowrap;
}
.toast.show{opacity:1}
</style>
</head>
<body>
<main class="poster" aria-label="BIA Pirate Week 2956 Treasure Hunt">

 <div class="scratch" id="scratch">
   <div class="secret"><div id="code"></div></div>
   <canvas id="cover"></canvas>
 </div>

 <button id="copy" type="button" aria-label="Copia codice"></button>

 <a class="rsi"
    href="https://robertsspaceindustries.com/en/comm-link/transmission/21285-Pirate-Week-2026"
    target="_blank" rel="noopener"
    aria-label="Apri Pirate Week su RSI"></a>

 <div class="toast" id="toast">✓ CODICE COPIATO</div>
</main>

<script>
(()=>{
 const canvas=document.getElementById("cover");
 const box=document.getElementById("scratch");
 const ctx=canvas.getContext("2d",{willReadFrequently:true});
 const codeEl=document.getElementById("code");
 const copy=document.getElementById("copy");
 const toast=document.getElementById("toast");

 const packed=[55,45,65,81,52,50,45,48,56,50,57,45,52,53,54,55,45,49,53,45,82,68,70,69,52,53,56,55,45,51,50,52,45,76,54];
 const secret=()=>packed.map(n=>String.fromCharCode(n)).join("");

 let active=false,last=null,done=false,count=0;

 function paint(){
   const r=box.getBoundingClientRect();
   const d=Math.max(1,window.devicePixelRatio||1);
   canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);
   canvas.style.width=r.width+"px";canvas.style.height=r.height+"px";
   ctx.setTransform(d,0,0,d,0,0);
   ctx.globalCompositeOperation="source-over";

   const g=ctx.createLinearGradient(0,0,r.width,r.height);
   g.addColorStop(0,"#9b6b1f");g.addColorStop(.18,"#e2b850");
   g.addColorStop(.42,"#f0cf78");g.addColorStop(.65,"#b9842e");
   g.addColorStop(.84,"#e3b753");g.addColorStop(1,"#8a5c1b");
   ctx.fillStyle=g;ctx.fillRect(0,0,r.width,r.height);

   ctx.strokeStyle="rgba(69,39,5,.32)";ctx.lineWidth=1;
   for(let i=0;i<100;i++){
     const x=(i*73)%r.width,y=(i*37)%r.height;
     ctx.beginPath();ctx.moveTo(x,y);
     ctx.lineTo(Math.min(r.width,x+r.width*.13),Math.max(0,y-r.height*.14));ctx.stroke();
   }

   ctx.fillStyle="rgba(30,18,2,.80)";
   ctx.textAlign="center";ctx.textBaseline="middle";
   ctx.font=`800 ${Math.max(10,r.width*.034)}px Arial`;
   ctx.fillText("☠  GRATTA PER RIVELARE  ☠",r.width/2,r.height/2);
 }

 function pos(x,y){
   const r=canvas.getBoundingClientRect();
   return {x:x-r.left,y:y-r.top};
 }
 function erase(p){
   ctx.globalCompositeOperation="destination-out";
   ctx.lineCap="round";ctx.lineJoin="round";
   ctx.lineWidth=Math.max(24,box.clientWidth*.085);
   if(last){
     ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();
   }else{
     ctx.beginPath();ctx.arc(p.x,p.y,Math.max(12,box.clientWidth*.043),0,Math.PI*2);ctx.fill();
   }
   last=p;if(++count%7===0)measure();
 }
 function measure(){
   if(done)return;
   const d=ctx.getImageData(0,0,canvas.width,canvas.height).data;
   let clear=0,total=0;
   for(let i=3;i<d.length;i+=240){total++;if(d[i]<40)clear++;}
   if(Math.round(clear/total*100)>=55)reveal();
 }
 function reveal(){
   done=true;codeEl.textContent=secret();
   canvas.style.transition="opacity .4s";canvas.style.opacity="0";canvas.style.pointerEvents="none";
   copy.style.display="block";
 }
 function start(x,y){active=true;last=null;erase(pos(x,y))}
 function move(x,y){if(active&&!done)erase(pos(x,y))}
 function end(){if(active){active=false;last=null;measure()}}

 canvas.addEventListener("mousedown",e=>{e.preventDefault();start(e.clientX,e.clientY)});
 window.addEventListener("mousemove",e=>{if(active){e.preventDefault();move(e.clientX,e.clientY)}});
 window.addEventListener("mouseup",end);

 canvas.addEventListener("touchstart",e=>{
   e.preventDefault();const t=e.touches[0];if(t)start(t.clientX,t.clientY);
 },{passive:false});
 canvas.addEventListener("touchmove",e=>{
   e.preventDefault();const t=e.touches[0];if(t)move(t.clientX,t.clientY);
 },{passive:false});
 canvas.addEventListener("touchend",e=>{e.preventDefault();end()},{passive:false});

 copy.addEventListener("click",async()=>{
   try{await navigator.clipboard.writeText(secret())}
   catch(e){
     const t=document.createElement("textarea");t.value=secret();document.body.appendChild(t);
     t.select();document.execCommand("copy");t.remove();
   }
   toast.classList.add("show");
   setTimeout(()=>toast.classList.remove("show"),1800);
 });

 paint();
})();
</script>
</body>
</html>
